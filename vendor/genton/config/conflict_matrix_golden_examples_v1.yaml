# ============================================================
# 11. 验收测试要求
# ============================================================

acceptance_criteria:
  description: "冲突矩阵验收测试要求"
  
  requirements:
    - requirement: "所有 16 个黄金样例必须通过"
      test_method: "CI 自动化测试"
      pass_criteria: "16/16 通过"
    
    - requirement: "baseline deny 必须压过所有非 baseline 规则"
      test_method: "CM-001, CM-002, CM-003 验证"
      pass_criteria: "baseline 规则始终生效"
    
    - requirement: "同 priority 裁决顺序正确（deny > confirmation > allow）"
      test_method: "CM-004, CM-005, CM-006 验证"
      pass_criteria: "裁决顺序符合规范"
    
    - requirement: "baseline 重叠冲突必须编译拒绝"
      test_method: "CM-009 验证"
      pass_criteria: "编译失败并报错"
    
    - requirement: "同 priority 不同 effect 冲突必须编译拒绝"
      test_method: "CM-010 验证"
      pass_criteria: "编译失败并报错"
    
    - requirement: "无匹配规则默认行为正确"
      test_method: "CM-011, CM-012, CM-013 验证"
      pass_criteria: "notification→P0, call_gate→RING, action→DENY"
    
    - requirement: "死规则检测正确"
      test_method: "CM-014 验证"
      pass_criteria: "编译成功但有 warning"
    
    - requirement: "用户显式授权不得覆盖基线 deny"
      test_method: "CM-015 验证"
      pass_criteria: "基线 deny 优先"
    
    - requirement: "Taint 冲突正确拒绝"
      test_method: "CM-016 验证"
      pass_criteria: "taintConflict: true → DENY"

# ============================================================
# 12. 使用说明
# ============================================================

usage_instructions:
  description: "如何使用冲突矩阵黄金样例"
  
  for_ci_testing:
    - step: "将样例加载到测试框架"
      command: "python tools/test_conflict_matrix.py"
    
    - step: "遍历每个 test_case"
      logic: "加载 input_rules → 提供 input_context → 调用策略引擎 → 比较 expected_result"
    
    - step: "报告通过/失败"
      format: "✓ CM-001 passed / ✗ CM-002 failed"
  
  for_regression_testing:
    - purpose: "策略引擎每次修改后运行冲突矩阵测试"
      requirement: "16/16 必须通过才能合并代码"
  
  for_documentation:
    - purpose: "作为策略 DSL 冲突裁决的权威参考"
      audience: "开发者、策略设计者、安全审计"

# ============================================================
# 13. 版本与兼容性
# ============================================================

metadata:
  version: "1.0.0"
  schema_version: "1.0"
  
  compatibility:
    requires:
      - baseline_policy_rules_v1.yaml
      - policy_catalog_v1.yaml
      - value_domain_catalog_v1.yaml
  
  update_policy:
    golden_examples_update: "随策略引擎版本更新，回归测试必须全过"
    backward_compatibility: "新版本必须兼容旧版本的冲突裁决语义"
